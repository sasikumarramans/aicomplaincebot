services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - aicompliance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published - only reachable by other containers on this network.
    # Uncomment to allow direct external access (e.g. for migrations/backups from outside):
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - generate 32+ random bytes}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required, e.g. http://31.97.205.56 for IP-only access}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required - use a real provider, not MailHog}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required - real S3 endpoint, not MinIO}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No host port published - the frontend container proxies /api to this service
    # over the internal Docker network. Put a real reverse proxy/load balancer with
    # TLS in front of the frontend container for external traffic.

  frontend:
    build:
      context: ../aicompliance-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No host port published - only reachable through the caddy reverse proxy below,
    # which terminates TLS and forwards here over the internal Docker network.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A bare port like ":80" makes Caddy serve plain HTTP with no automatic TLS -
      # use this for IP-only access (Let's Encrypt cannot issue certs for a bare IP).
      # Once a domain is pointed at this server, switch SITE_ADDRESS to that domain
      # (e.g. app.example.com) and Caddy will automatically provision and renew a
      # real cert on restart - no other config changes needed.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required - use :80 for IP-only, or a domain for automatic HTTPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - aicompliance-postgres-backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  aicompliance-postgres-data:
  aicompliance-postgres-backups:
  caddy-data:
  caddy-config:
