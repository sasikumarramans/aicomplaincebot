name: Backend Dev CD

on:
  push:
    branches: [develop]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The default `docker` buildx driver can't export cache (type=gha cache-to below) -
      # only the docker-container driver can, hence this step before the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    # Uses repo-level secrets (SSH_HOST/SSH_USERNAME/SSH_PRIVATE_KEY) - same server as
    # production, only the compose project name, port mapping, and .env file differ.
    steps:
      # Deploys into ~/complaince-dev/backend using the aicompliance-dev compose project
      # name, which keeps it fully separate from the production stack in ~/app/backend
      # (different containers, network, and volumes - see docker-compose.dev.yml).
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/complaince-dev/backend
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
            docker pull "$BACKEND_IMAGE"
            docker compose -f docker-compose.dev.yml --env-file .env.dev -p aicompliance-dev up -d --no-build backend
            docker image prune -f
