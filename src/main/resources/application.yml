spring:
  application:
    name: ai-compliance-copilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/aicompliance}
    username: ${DB_USERNAME:aicompliance}
    password: ${DB_PASSWORD:aicompliance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9010}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:aicompliance-certificates}
    access-key: ${STORAGE_ACCESS_KEY:aicompliance}
    secret-key: ${STORAGE_SECRET_KEY:aicompliance123}
    path-style-access: ${STORAGE_PATH_STYLE:true}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    extraction-model: ${OPENAI_EXTRACTION_MODEL:gpt-4o-mini}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
