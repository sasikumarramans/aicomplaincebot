<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Employee Report</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; color: #222; }
        h1 { font-size: 18px; margin-bottom: 4px; }
        .meta { color: #666; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Employee Certification Report</h1>
    <div class="meta">
        <span th:text="${companyName}">Company</span> &#183;
        Generated <span th:text="${generatedAt}">date</span>
    </div>
    <table>
        <thead><tr><th>Employee</th><th>Certification</th><th>Expiry Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="row : ${certifications}">
            <td th:text="${row.employeeName}">Employee</td>
            <td th:text="${row.certificationType}">Type</td>
            <td th:text="${row.expiryDate}">Date</td>
            <td th:text="${row.expiryBucket}">Bucket</td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(certifications)}">No employee certifications found.</p>
</body>
</html>
