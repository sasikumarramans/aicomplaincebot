spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.aicompliance: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
